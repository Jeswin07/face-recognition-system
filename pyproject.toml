[project]
name = "face-recognition-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeswin K Reji", email = "jeswinkr7@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "albumentations>=2.0.8",
    "huggingface-hub>=1.29.0",
    "insightface>=1.0.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.29.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "streamlit>=1.62.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "ultralytics>=8.4.135",
]

[project.scripts]
face-recognition-system = "face_recognition_system:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
